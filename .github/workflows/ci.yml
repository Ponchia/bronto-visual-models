name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:docs
      - run: npm run build
      - run: npm test
      - run: npm run test:pack
      - name: Record reproducible store benchmark
        if: matrix.node == '24'
        run: node --experimental-strip-types scripts/benchmark-store.mjs > .tmp/benchmark-store.json
      - name: Record graph preparation and data-transfer benchmark
        if: matrix.node == '24'
        run: npm run bench:exploration
      - name: Retain exploration benchmark
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exploration-benchmark
          path: .tmp/benchmark-exploration.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain benchmark evidence
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-benchmark
          path: .tmp/benchmark-store.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain installable beta package
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: .tmp/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  browser:
    name: Packed UI / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BVM_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:docs
      - run: npm run build
      - name: Verify Playwright package and preinstalled image agree
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = require('playwright/package.json').version;
          assert.equal(version, lock.packages['node_modules/playwright'].version);
          assert.equal(require('playwright-core/package.json').version, version);
          assert.equal(lock.packages['node_modules/playwright-core'].version, version);
          const image = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(image.driverVersion, version, 'Update the pinned image with Playwright');
          assert.equal(image.dockerImageName, `mcr.microsoft.com/playwright:v${version}-noble`);
          console.log(`Verified Playwright ${version} against ${image.dockerImageName}`);
          NODE
      - run: npm run site:build:packed
      - run: npm run check:bundle
      - run: npm run test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: |
            .tmp/browser/
            .tmp/bundle-report.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Prepare Pages artifact
        if: matrix.browser == 'chromium' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist
  distribution:
    name: Published archive identity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - run: node scripts/check-distribution.mjs --online
  publish-demo:
    name: Publish verified demo
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [core, browser, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
