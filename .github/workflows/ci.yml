name: CI
on:
  push:
    branches: [main]
    tags: ['v*-beta.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  package:
    name: Build candidate archive
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: mkdir -p .tmp && npm pack --ignore-scripts --pack-destination .tmp
      - name: Record candidate identity
        id: identity
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { inspectArchive } from './scripts/package-archive.mjs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const archive = inspectArchive('.tmp', version);
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${archive.sha256}\n`);
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: .tmp/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  core:
    name: Core / Node ${{ matrix.node }}
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:docs
      - run: npm run build
      - run: npm test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .tmp/candidate
      - run: npm run test:pack
        env:
          BVM_PACKAGE_DIRECTORY: .tmp/candidate
          BVM_PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
      - name: Record reproducible store benchmark
        if: matrix.node == '24'
        run: node --experimental-strip-types scripts/benchmark-store.mjs > .tmp/benchmark-store.json
      - name: Record graph preparation and data-transfer benchmark
        if: matrix.node == '24'
        run: npm run bench:exploration
      - name: Retain exploration benchmark
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exploration-benchmark
          path: .tmp/benchmark-exploration.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain benchmark evidence
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-benchmark
          path: .tmp/benchmark-store.json
          include-hidden-files: true
          if-no-files-found: error
  browser:
    name: Packed UI / ${{ matrix.browser }}
    needs: package
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BVM_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:docs
      - run: npm run build
      - name: Verify Playwright package and preinstalled image agree
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const version = require('playwright/package.json').version;
          assert.equal(version, lock.packages['node_modules/playwright'].version);
          assert.equal(require('playwright-core/package.json').version, version);
          assert.equal(lock.packages['node_modules/playwright-core'].version, version);
          const image = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          assert.equal(image.driverVersion, version, 'Update the pinned image with Playwright');
          assert.equal(image.dockerImageName, `mcr.microsoft.com/playwright:v${version}-noble`);
          console.log(`Verified Playwright ${version} against ${image.dockerImageName}`);
          NODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: .tmp/candidate
      - run: npm run site:build:packed
        env:
          BVM_PACKAGE_DIRECTORY: .tmp/candidate
          BVM_PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
      - run: npm run check:bundle
      - run: npm run test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: |
            .tmp/browser/
            .tmp/bundle-report.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Prepare Pages artifact
        if: matrix.browser == 'chromium' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist
  distribution:
    name: Published archive identity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
      - run: node scripts/check-distribution.mjs --online
  publish-demo:
    name: Publish verified demo
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [core, browser, distribution]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  release-archive:
    name: Beta archive release
    needs: [package, core, browser, distribution]
    if: github.repository == 'Ponchia/bronto-visual-models' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_BETA_RELEASES == 'true'
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-archive.yml
    with:
      sha256: ${{ needs.package.outputs.sha256 }}
      qualification: ${{ toJSON(needs) }}
  # npm beta release. Runs only after the Beta archive release job published and
  # verified the same qualified archive as a GitHub prerelease; the registry gets
  # exactly those bytes under the `beta` dist-tag and `latest` is never moved.
  # The FIRST version must be bootstrapped by an npm owner
  # (docs/releasing.md#npm-registry): npm only trusts OIDC for existing packages.
  # The runner's npm never publishes: npm 11.21.1 and 12.2.1 bundle Undici
  # 6.29.0 (Ponchia/bronto-ui#234). This read-only job prepares the unchanged
  # npm source pinned in tooling/publisher/source.json with its separately
  # locked dependencies and audits the complete installed graph before the
  # privileged job can start. It is read-only and runs on every push and pull
  # request, so a publisher advisory surfaces before a release tag does.
  npm-publisher-readiness:
    name: Source-locked npm publisher audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out only the reviewed publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/source-publisher.mjs
            /scripts/extract-publisher-source.py
            /scripts/audit-publishing-tooling.mjs
            /tooling/publisher/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          package-manager-cache: false
      - name: Prepare and audit the source-locked publisher
        shell: bash
        env:
          npm_config_cache: ${{ runner.temp }}/publisher-audit-cache
        run: |
          set -euo pipefail
          node scripts/source-publisher.mjs prepare "$RUNNER_TEMP/vm-publisher"
          node scripts/source-publisher.mjs audit "$RUNNER_TEMP/vm-publisher" "$RUNNER_TEMP/publisher-audit.json"

  npm-publish:
    name: Publish the released archive to npm
    needs: [package, release-archive, npm-publisher-readiness]
    if: github.repository == 'Ponchia/bronto-visual-models' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_BETA_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    concurrency:
      group: npm-beta-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      archive: ${{ steps.candidate.outputs.archive }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          check-latest: true
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Package source is never checked out here: only the publisher tooling,
      # which is prepared and audited again because this job runs it.
      - name: Check out only the reviewed publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: publisher
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/source-publisher.mjs
            /scripts/extract-publisher-source.py
            /scripts/audit-publishing-tooling.mjs
            /tooling/publisher/
      - name: Prepare and audit the source-locked publisher
        shell: bash
        env:
          npm_config_cache: ${{ runner.temp }}/publisher-audit-cache
        run: |
          set -euo pipefail
          node publisher/scripts/source-publisher.mjs prepare "$RUNNER_TEMP/vm-publisher"
          node publisher/scripts/source-publisher.mjs audit "$RUNNER_TEMP/vm-publisher" "$RUNNER_TEMP/publisher-audit.json"
          version="$(node "$RUNNER_TEMP/vm-publisher/source/bin/npm-cli.js" --version)"
          echo "Source-locked npm $version"
          node -e 'const v=process.argv[1].split(".").map(Number);if(v[0]<11||(v[0]===11&&(v[1]<5||(v[1]===5&&v[2]<1))))process.exit(1)' "$version"
      - name: Download the archive the GitHub release verified
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: candidate
      - name: Verify archive bytes, package identity and registry state
        id: candidate
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          npm_cli="$RUNNER_TEMP/vm-publisher/source/bin/npm-cli.js"
          if [[ ! "$RELEASE_TAG" =~ ^v0\.1\.0-beta\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Only v0.1.0-beta.N tags may publish'; exit 2
          fi
          version="${RELEASE_TAG#v}"
          archive="ponchia-visual-models-$version.tgz"
          cd candidate
          test "$(ls)" = "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          node - "$archive" "$version" <<'NODE'
          const { execFileSync } = require("node:child_process");
          const [path, version] = process.argv.slice(2);
          const pkg = JSON.parse(execFileSync("tar", ["-xOf", path, "package/package.json"], { encoding: "utf8" }));
          if (pkg.name !== "@ponchia/visual-models" || pkg.version !== version ||
              pkg.repository?.url !== "git+https://github.com/Ponchia/bronto-visual-models.git" || pkg.private)
            throw Error("Refusing wrong npm scope, version, upstream repository or a private package");
          NODE
          # The registry does not authorize first releases via OIDC.
          if ! node "$npm_cli" view @ponchia/visual-models name --json --registry https://registry.npmjs.org > /dev/null 2> "$RUNNER_TEMP/npm-name.log"; then
            echo '::error::@ponchia/visual-models is not bootstrapped on npm or npm is unreachable. Follow docs/releasing.md#npm-registry.'
            exit 2
          fi
          if node "$npm_cli" view "@ponchia/visual-models@$version" version --json --registry https://registry.npmjs.org > /dev/null 2> "$RUNNER_TEMP/npm-version.log"; then
            echo '::error::This version already exists in npm; refusing a second publish'; exit 2
          fi
          grep -q 'E404' "$RUNNER_TEMP/npm-version.log" || {
            echo '::error::npm lookup failed for a reason other than a missing version'; exit 2;
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish the verified archive under the beta dist-tag (npm OIDC)
        shell: bash
        env:
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
        run: |
          set -euo pipefail
          cd candidate
          # No package source, dependencies or lifecycle scripts in the OIDC job.
          # npm matches the top-level workflow, so these jobs live in ci.yml:
          # trusted publisher Ponchia/bronto-visual-models, ci.yml, npm-publish.
          node "$RUNNER_TEMP/vm-publisher/source/bin/npm-cli.js" publish "./$ARCHIVE" --ignore-scripts --provenance --access public --tag beta --registry https://registry.npmjs.org
          echo 'npm accepted publication. The read-only registry job must still pass; never publish again to recover it.' >> "$GITHUB_STEP_SUMMARY"

  # No publishing authority here. Rerun this job alone after propagation errors.
  npm-verify-registry:
    name: Verify the registry serves the same bytes
    needs: [package, npm-publish]
    if: github.repository == 'Ponchia/bronto-visual-models' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.ENABLE_BETA_RELEASES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: candidate
      - name: Compare registry integrity, bytes, beta tag and provenance
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.package.outputs.sha256 }}
          VERSION: ${{ needs.npm-publish.outputs.version }}
          ARCHIVE: ${{ needs.npm-publish.outputs.archive }}
        run: |
          set -euo pipefail
          test "$(sha256sum "candidate/$ARCHIVE" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          mkdir -p "$RUNNER_TEMP/registry"
          for attempt in 1 2 3 4 5 6; do
            if npm view "@ponchia/visual-models@$VERSION" --json --registry https://registry.npmjs.org > "$RUNNER_TEMP/registry/view.json" 2> /dev/null; then break; fi
            [ "$attempt" -lt 6 ] || { echo '::error::The published version is not visible yet; rerun this job only.'; exit 1; }
            sleep 20
          done
          (cd "$RUNNER_TEMP/registry" && npm pack "@ponchia/visual-models@$VERSION" --ignore-scripts --registry https://registry.npmjs.org > /dev/null)
          test "$(sha256sum "$RUNNER_TEMP/registry/$ARCHIVE" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          node - "$RUNNER_TEMP/registry/view.json" "candidate/$ARCHIVE" "$VERSION" <<'NODE'
          const fs = require("node:fs");
          const { createHash } = require("node:crypto");
          const [viewPath, archive, version] = process.argv.slice(2);
          const view = JSON.parse(fs.readFileSync(viewPath, "utf8"));
          const integrity = `sha512-${createHash("sha512").update(fs.readFileSync(archive)).digest("base64")}`;
          if (view.version !== version || view.dist?.integrity !== integrity) throw Error("Registry integrity differs from the released archive");
          if (view["dist-tags"]?.beta !== version) throw Error("beta dist-tag does not point at this version");
          if (!view.dist?.attestations?.provenance) throw Error("Registry metadata advertises no provenance attestation");
          NODE
          echo "Registry serves the released archive ($EXPECTED_SHA256) under beta with provenance." >> "$GITHUB_STEP_SUMMARY"
