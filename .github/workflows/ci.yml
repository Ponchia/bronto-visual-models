name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:docs
      - run: npm run build
      - run: npm test
      - run: npm run test:pack
      - name: Record reproducible store benchmark
        if: matrix.node == '24'
        run: node --experimental-strip-types scripts/benchmark-store.mjs > .tmp/benchmark-store.json
      - name: Record graph preparation and data-transfer benchmark
        if: matrix.node == '24'
        run: npm run bench:exploration
      - name: Retain exploration benchmark
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exploration-benchmark
          path: .tmp/benchmark-exploration.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain benchmark evidence
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-benchmark
          path: .tmp/benchmark-store.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain installable beta package
        if: matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: .tmp/*.tgz
          include-hidden-files: true
          if-no-files-found: error
  browser:
    name: Packed UI / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      BVM_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint:docs
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run site:build:packed
      - run: npm run check:bundle
      - run: npm run test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-evidence-${{ matrix.browser }}
          path: |
            .tmp/browser/
            .tmp/bundle-report.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Prepare Pages artifact
        if: matrix.browser == 'chromium' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-dist
  publish-demo:
    name: Publish verified demo
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [core, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
